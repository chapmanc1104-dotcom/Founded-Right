kind = "web"
previewPath = "/"
title = "BizLaunch"
version = "1.0.0"
id = "artifacts/bizlaunch"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24748

[services.development]
run = "pnpm --filter @workspace/bizlaunch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bizlaunch", "run", "build" ]
publicDir = "artifacts/bizlaunch/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24748"
BASE_PATH = "/"
