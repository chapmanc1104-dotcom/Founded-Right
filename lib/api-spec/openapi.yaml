openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: BizLaunch API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: resources
    description: Business resources
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: List business resources
      description: Returns a list of curated business launch resources
      responses:
        "200":
          description: List of resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
  /checklist:
    get:
      operationId: getChecklist
      tags: [resources]
      summary: Get launch checklist
      description: Returns a business launch checklist
      responses:
        "200":
          description: Checklist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChecklistItem"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Resource:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        url:
          type: string
        icon:
          type: string
      required:
        - id
        - title
        - description
        - category
    ChecklistItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        order:
          type: integer
      required:
        - id
        - title
        - description
        - category
        - order
