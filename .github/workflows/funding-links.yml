name: Check federal funding links
on:
  schedule:
    - cron: "17 13 * * 1" # Mondays
  workflow_dispatch:
  pull_request:
    paths:
      - "artifacts/api-server/src/data/federalPrograms.ts"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server run check:funding
